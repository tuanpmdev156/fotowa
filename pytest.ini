[pytest]
addopts = -v --browser chromium --screenshot only-on-failure --tracing retain-on-failure
testpaths = tests
pythonpath = .
# Test đặt tên theo mã test case (TC_01_...), không theo tiền tố `test_` mặc định.
python_functions = TC_* test_*
markers =
    incremental: các test chạy nối tiếp, test sau bị skip nếu test trước fail
